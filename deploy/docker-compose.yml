# StockQR on a NAS (Unraid: Compose Manager plugin, or any Docker host).
# Copy .env.example to .env next to this file and set DB_PASSWORD first.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockqr
      POSTGRES_USER: stockqr
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - ${APPDATA:-/mnt/user/appdata/stockqr}/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockqr -d stockqr"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Same REST API as Supabase, used by the app through the app container
  rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${DB_PASSWORD}@db:5432/stockqr
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_OPENAPI_MODE: disabled
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ghcr.io/cocoxis/qr-stock-craft:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8085}:8080"
    environment:
      DATABASE_URL: postgres://stockqr:${DB_PASSWORD}@db:5432/stockqr
      AUTHENTICATOR_PASSWORD: ${DB_PASSWORD}
      POSTGREST_URL: http://rest:3000
      BACKUP_SUPABASE_URL: ${BACKUP_SUPABASE_URL:-}
      BACKUP_SUPABASE_KEY: ${BACKUP_SUPABASE_KEY:-}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-6}
      BACKUP_KEEP: ${BACKUP_KEEP:-30}
    volumes:
      - ${APPDATA:-/mnt/user/appdata/stockqr}/backups:/backups
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
